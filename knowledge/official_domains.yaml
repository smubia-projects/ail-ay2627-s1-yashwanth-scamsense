url_shorteners: [bit.ly, tinyurl.com, t.co, goo.gl, is.gd, cutt.ly, rb.gy, shorturl.at, ow.ly, tiny.cc, s.id, bit.do, rebrand.ly, buff.ly, t.ly, v.gd, shorturl.asia, qrco.de]
# Low-severity signal only: TLDs very commonly seen on throw-away scam domains.
risky_tlds: [xyz, top, icu, vip, click, cyou, buzz, rest, sbs, cfd, cc, tk, ml, ga, cf, gq, monster]
