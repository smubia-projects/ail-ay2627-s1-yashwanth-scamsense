# Official domains used by the deterministic lookalike check (pipeline/rules.py).
#
# verified: false
# TODO(owner): verify every entry against the organisation's own website / a current ScamShield or
# police advisory before relying on it in a demo. Entries are from general knowledge; they are
# intentionally limited to well-known domains. A domain NOT in this list is never proof of a scam —
# this list only powers "looks like X but isn't X" checks.
#
# domains : registrable domains the organisation really uses (subdomains are also treated as official)
# tokens  : brand words used to spot brand names inside someone else's domain / in message text
verified: false
entities:
  - name: Singapore Government
    tokens: [gov.sg, govsg, singpass, myinfo, corppass]
    domains: [gov.sg]
  - name: Singpass
    tokens: [singpass]
    domains: [singpass.gov.sg]
