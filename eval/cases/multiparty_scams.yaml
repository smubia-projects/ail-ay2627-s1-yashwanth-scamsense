# Multi-party scam conversations. ALL SYNTHETIC: reconstructed from commonly reported public scam patterns
# (police/SPF & ScamShield style advisories), not copied from real victims. Numbers/domains are made up.
# split: dev  = cases the developer was allowed to look at while tuning prompts/rules
#        test = held-out; not used for tuning
- id: mp01_gov_courier_police_prosecutor
  label: scam
  category: gov_official_impersonation
  synthetic: true
  split: dev
  text: |
    Courier: Hello, this is Ninja Express customer service. A parcel under your name containing 5 passports was intercepted at customs.
    Courier: I will transfer you to the police now. Please hold.
    Officer Lim: I am Inspector Lim from the Singapore Police Force. Your NRIC S1234567D is linked to a money laundering case.
    Officer Lim: Do not tell anyone, this is a confidential investigation. Add me on WhatsApp +65 9123 4567.
    Prosecutor Tan: This is the prosecutor handling your case. Officer Lim is correct. You must transfer your savings to a safe account 123-456-789 for verification, immediately, or a warrant will be issued.
    You: ok what do I do
- id: mp02_gov_telco_mas
  label: scam
  category: gov_official_impersonation
  synthetic: true
  split: test
  text: |
    Singtel Rep: Good afternoon, your mobile line was used to send illegal messages and will be disconnected in 2 hours.
    Singtel Rep: To clear your name I will connect you to the Monetary Authority of Singapore officer.
    MAS Officer Wong: I'm Officer Wong from MAS. Your bank accounts are involved in fraud. We need to protect your funds.
    MAS Officer Wong: Do not inform your bank or family. Move your money into the MAS holding account that I will give you. Download the MAS Secure app from this link: http://mas-secure-app.top/install.apk
    Victim: is this really MAS?
    MAS Officer Wong: Yes. My supervisor Mr Goh will confirm in a call.
