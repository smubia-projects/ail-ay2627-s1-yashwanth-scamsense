# Single-message scams (SMS / DM style). SYNTHETIC reconstructions of commonly reported patterns; domains/numbers are made up.
- id: s01_dbs_lookalike_sms
  label: scam
  category: bank_phishing
  synthetic: true
  split: dev
  text: "DBS: Your account has been locked due to unusual activity. Verify now to avoid permanent suspension: https://dbs-secure-login.top/verify"
