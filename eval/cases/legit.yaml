# Genuine / benign messages used as FALSE-POSITIVE checks. Written in the style of real notices and chats;
# several deliberately contain words that scams also use (OTP, transfer, urgent, link, PayNow) to stress the system.
# Domains here are official ones (dbs.com.sg, singpost.com, gov.sg ...) or neutral placeholders.
- id: l01_bank_otp
  label: legit
  category: bank_notice
  synthetic: true
  split: dev
  text: "DBS: Your OTP is 483920 for the transaction at SHOPEE. Do not share this OTP with anyone, including DBS staff. If you did not request this, call the number on the back of your card."
- id: l02_singpost_delivery
  label: legit
  category: delivery_notice
  synthetic: true
  split: test
  text: "SingPost: Your parcel SG8827361 will be delivered today between 2pm and 5pm. Track your item at https://www.singpost.com/track-items. No action needed."
- id: l03_friend_dinner
  label: legit
  category: normal_chat
  synthetic: true
  split: test
  text: |
    Ben: are we still on for dinner at 7?
    Ali: yes! I booked the table at the Thai place. Bring your sister too
    Ben: nice, see you there
- id: l04_split_bill_paynow
  label: legit
  category: normal_chat
  synthetic: true
  split: dev
  text: |
    Priya: Dinner was $84 total, so $21 each. Can everyone PayNow me when you can?
    Marcus: sure, sending now
    Priya: thanks guys, no rush!
