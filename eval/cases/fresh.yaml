# FRESH cases (split: fresh). Written AFTER the first live eval run and BEFORE the prompt change that followed it,
# as a clean check that the false-alarm fix wasn't just fitted to the cases we had already seen.
# Not used for tuning. Still synthetic and still written by the system's author (see limitations in results.md).
# 12 genuine messages (several deliberately contain 'scammy' words: urgent, link, OTP, transfer, verify) + 8 subtler scams.
- id: f01_ninjavan_delivery
  label: legit
  category: delivery_notice
  synthetic: true
  split: fresh
  text: "Ninja Van: Your parcel will arrive today. Our rider will call you before delivery. You can track it in the Ninja Van app or at https://www.ninjavan.co/en-sg/tracking. No payment is needed."
- id: f02_bank_new_device
  label: legit
  category: bank_notice
  synthetic: true
  split: fresh
  text: "UOB: A new device was used to log in to your UOB TMRW app at 2:14pm. If this was you, no action is needed. If not, please call the number on the back of your card. We will never ask for your PIN or OTP."
- id: f03_hr_payroll
  label: legit
