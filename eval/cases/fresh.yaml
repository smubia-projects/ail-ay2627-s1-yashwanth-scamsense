- id: f13_scam_polite_bank
  label: scam
  category: bank_phishing
  synthetic: true
  split: fresh
  text: |
    Linda (Maybank Security): Good afternoon sir, this is Linda from Maybank security. We noticed a transaction of $2,350 to an overseas merchant. Did you authorise it?
    You: no I didn't
    Linda (Maybank Security): Thank you for confirming. To block it I'll send a verification code to your phone. Kindly read it back to me so I can stop the payment.
